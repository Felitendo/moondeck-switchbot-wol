name: 🐛 Bug report
description: Something does not work as it should.
labels:
- bug
body:
- type: markdown
  attributes:
    value: Thanks for taking the time! The more you fill in, the faster it can be fixed.
- type: checkboxes
  id: checks
  attributes:
    label: Before you start
    options:
    - label: I searched the issues and this is not reported yet.
      required: true
    - label: I use the latest version.
      required: true
- type: textarea
  id: what
  attributes:
    label: What happened?
    description: What did you do, and what went wrong?
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: What did you expect?
  validations:
    required: true
- type: dropdown
  id: end
  attributes:
    label: Where?
    options:
    - On the Steam Deck (waking)
    - On the PC (logging in)
    - Both
    - Not sure
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Version
    description: The output of `moondeck-switchbot-wol --version`.
    placeholder: moondeck-switchbot-wol 1.0.0
  validations:
    required: true
- type: input
  id: system
  attributes:
    label: System
    description: On the Deck SteamOS or another one, on the PC the distribution and the login screen.
    placeholder: SteamOS 3.7, CachyOS with Plasma Login
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Status and logs
    description: The output of `moondeck-switchbot-wol status` and `moondeck-switchbot-wol log` on the Deck. For the PC, `sudo moondeck-switchbot-wol host status` and `journalctl -u 'moondeck-switchbot-wol-login@*'`. Remove anything secret.
    render: shell
- type: textarea
  id: more
  attributes:
    label: Anything else?
    description: Screenshots, videos or anything else that could help.
